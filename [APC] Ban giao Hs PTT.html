<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Thông Tin Bàn Giao Hồ Sơ Khai Thác & Vận Hành</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="mb-8 border-b pb-5">
            <h1 class="text-3xl font-bold text-blue-900">Hồ Sơ Quản Lý Thi Công & Chất Lượng Công Trình</h1>
            <p class="text-gray-500 mt-2 text-sm">Căn cứ: Nghị định số 207/2026/NĐ-CP | QLDA GXD — Điều 28; Phụ lục II; Phụ lục VII</p>
        </div>

        <!-- Filter & Search -->
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <select id="categoryFilter" class="p-2 border rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 md:w-1/3">
                <option value="all">Tất cả danh mục hồ sơ</option>
                <option value="Bản vẽ hoàn công">Bản vẽ hoàn công</option>
                <option value="Nhật ký thi công">Nhật ký thi công xây dựng</option>
                <option value="Chứng từ vật liệu">Chứng từ xuất xứ, chứng nhận vật liệu</option>
                <option value="Kết quả thí nghiệm">Kết quả đo đạc, quan trắc, thí nghiệm</option>
                <option value="Nghiệm thu công việc">Biên bản nghiệm thu công việc</option>
                <option value="Quy trình vận hành">Quy trình vận hành, bảo trì</option>
                <option value="Văn bản pháp lý">Văn bản PCCC, môi trường, an toàn</option>
                <option value="Sự cố công trình">Hồ sơ giải quyết sự cố</option>
                <option value="Nghiệm thu hoàn thành">Biên bản nghiệm thu hoàn thành</option>
                <option value="Thông báo kiểm tra">Thông báo kết quả kiểm tra của CQNN</option>
            </select>
            <input type="text" id="searchInput" placeholder="Tìm kiếm tên tài liệu..." class="p-2 border rounded-md shadow-sm w-full md:w-2/3">
        </div>

        <!-- Bảng Dữ Liệu -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-16">STT</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-1/4">Nhóm Hồ Sơ</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Tên Tài Liệu Chi Tiết</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-32">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="dataTable" class="bg-white divide-y divide-gray-200">
                    <tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbw53fuTjojwjvUSnlYNp2xdPaWkLgY5kW28CWodWWopiL-RvTiSTYmLY0g9qT5tfU16/exec'; 
        let rawData = [];

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                rawData = await response.json();
                renderTable(rawData);
            } catch (error) {
                document.getElementById('dataTable').innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-red-500">Lỗi tải dữ liệu. Vui lòng kiểm tra lại kết nối.</td></tr>';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Không tìm thấy tài liệu nào.</td></tr>';
                return;
            }

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors';
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${row.STT || index + 1}</td>
                    <td class="px-6 py-4 text-sm font-medium text-slate-700">${row.NhomHoSo || ''}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${row.TenTaiLieu || ''}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        ${row.LinkFile ? `<a href="${row.LinkFile}" target="_blank" class="text-blue-600 hover:text-blue-900 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded inline-flex items-center"><i class="fa-solid fa-download mr-1.5"></i> Xem / Tải</a>` : '<span class="text-gray-400 italic">Chưa có file</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Chức năng lọc và tìm kiếm
        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            const filtered = rawData.filter(row => {
                const matchSearch = (row.TenTaiLieu || '').toLowerCase().includes(searchTerm) || 
                                    (row.NhomHoSo || '').toLowerCase().includes(searchTerm);
                const matchCategory = category === 'all' || (row.NhomHoSo || '') === category;
                return matchSearch && matchCategory;
            });

            renderTable(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('categoryFilter').addEventListener('change', filterData);

        // Khởi chạy lấy dữ liệu
        fetchData();
    </script>
</body>
</html>
